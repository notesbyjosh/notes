---
layout: default
---
<article class="article-page"><header class="article-heading"><a class="backlink" href="{{ '/notebook/' | relative_url }}">← Back to notes</a><p class="eyebrow">{{ page.date | date: '%B %-d, %Y' }}</p><h1>{{ page.title }}</h1><div class="entry-tags">{% for tag in page.tags %}<a class="entry-tag" href="{{ '/notebook/' | relative_url }}#tag={{ tag | uri_escape }}">{{ tag }}</a>{% endfor %}</div></header><div class="entry-body prose">{{ content }}</div><div class="article-end"><a href="{{ '/notebook/' | relative_url }}">← All notes</a><a href="{{ '/work/' | relative_url }}">Explore more work ↗</a></div></article>
