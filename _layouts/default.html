<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="icon" href="{{ '/assets/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/favicon-180.png' | relative_url }}">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')==='light'?'light':'dark'}catch(e){}</script>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="wrap">
    <header class="masthead">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Notes by Josh home">
        <img class="logo logo-light" src="{{ '/assets/logo-light.png' | relative_url }}" alt="" width="76" height="76">
        <img class="logo logo-dark" src="{{ '/assets/logo-dark.png' | relative_url }}" alt="" width="76" height="76">
        <span>notesbyjosh<span class="brand-sub">DATA · FABRIC · AI</span></span>
      </a>
      <nav class="navigation" aria-label="Main navigation">
        <a href="{{ '/work/' | relative_url }}" {% if page.section == 'work' %}aria-current="page"{% endif %}>Work</a>
        <a href="{{ '/notebook/' | relative_url }}" {% if page.section == 'notes' or page.layout == 'post' %}aria-current="page"{% endif %}>Notes</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.section == 'about' %}aria-current="page"{% endif %}>About</a>
        <button id="theme-toggle" aria-label="Switch to light theme" title="Switch theme">◐</button>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="footer"><div><strong>Notes by Josh</strong><p>Building, exploring, and writing things down.</p></div><div class="footer-links"><a href="https://github.com/notesbyjosh">GitHub ↗</a><a href="{{ '/feed.xml' | relative_url }}">RSS</a><a href="{{ '/about/' | relative_url }}">About</a></div></footer>
  </div>
  <script src="{{ '/assets/app.js' | relative_url }}" defer></script>
</body>
</html>
